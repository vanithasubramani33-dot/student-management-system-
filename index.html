<!-- Form element-uku kandipa id="studentForm" irukanum -->
<form id="studentForm">
    <div class="form-group">
        <input type="text" id="studentId" placeholder="ID" required>
    </div>
    <div class="form-group">
        <input type="text" id="studentName" placeholder="Name" required>
    </div>
    <div class="form-group">
        <input type="email" id="studentEmail" placeholder="Email" required>
    </div>
    <div class="form-group">
        <input type="text" id="studentCourse" placeholder="Course" required>
    </div>
    <div class="form-group">
        <input type="tel" id="studentPhone" placeholder="Phone" required>
    </div>
    <button type="submit" id="addBtn">Add Student</button>
</form>

<!-- Table dynamic structure body tag-uku id="studentTableBody" irukanum -->
<table id="studentTable">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Phone</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="studentTableBody">
        <!-- JS records inge thaan entry aagum -->
    </tbody>
</table>
