<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Student Entry Form -->
        <form id="studentForm">
            <div class="form-group">
                <input type="text" id="studentId" placeholder="ID" required>
            </div>
            <div class="form-group">
                <input type="text" id="studentName" placeholder="Name" required>
            </div>
            <div class="form-group">
                <input type="email" id="studentEmail" placeholder="Email" required>
            </div>
            <div class="form-group">
                <input type="text" id="studentCourse" placeholder="Course" required>
            </div>
            <div class="form-group">
                <input type="tel" id="studentPhone" placeholder="Phone" required>
            </div>
            <button type="submit" id="addBtn">Add Student</button>
        </form>

        <!-- Student Data Display Table -->
        <h2>Student List</h2>
        <div class="table-responsive">
            <table id="studentTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Phone</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <!-- Data inputs will appear here dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
