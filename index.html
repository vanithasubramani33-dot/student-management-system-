<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Student Management System</h1>

    <div class="container">

        <h2>Add Student</h2>

        <input type="number" id="studentId" placeholder="Student ID">
        <input type="text" id="studentName" placeholder="Student Name">
        <input type="email" id="studentEmail" placeholder="Email">
        <input type="text" id="studentCourse" placeholder="Course">
        <input type="text" id="studentPhone" placeholder="Phone">

        <button onclick="addStudent()">Add Student</button>

    </div>

    <div class="search">
        <input type="text" id="searchInput"
               placeholder="Search student..."
               onkeyup="searchStudent()">
    </div>

    <div class="container">

        <h2>Student List</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Phone</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTable">
            </tbody>

        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
